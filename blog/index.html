<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog – James Squires</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --bg: #ffffff;
      --text: #222;
      --accent: #0066cc;
      --meta: #666;
      --border: #eee;
    }

    body {
      font-family: "Georgia", serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      margin: 0;
      padding: 0;
    }

    header, main, footer {
      max-width: 750px;
      margin: 0 auto;
      padding: 2rem;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .nav-title {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .nav-links a {
      margin-left: 1rem;
      text-decoration: none;
      color: var(--accent);
      font-family: sans-serif;
      font-size: 0.9rem;
    }

    .epigraph {
      text-align: center;
      font-style: italic;
      letter-spacing: 0.15em;
      color: #636e72;
      margin: 3rem 0;
      font-size: 1.2rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    /* Blog List Styling */
    .post-list {
      list-style: none;
      padding: 0;
      margin-top: 2rem;
    }

    .post-item {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .post-date {
      font-family: sans-serif;
      font-size: 0.85rem;
      color: var(--meta);
      margin-bottom: 0.25rem;
    }

    .post-link {
      font-size: 1.25rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }

    .post-link:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--meta);
      margin-top: 4rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="nav-title">James Squires</div>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/notes/">Notes & Articles</a>
        <a href="/blog/">Blog</a>
      </nav>
    </div>
  </header>

  <main class="content">
    <div class="epigraph">ΕΝ ΟΙΔΑ ΟΤΙ ΟΥΔΕΝ ΟΙΔΑ</div>

    <h1>Blog</h1>

    <ul class="post-list">
      <li class="post-item">
        <span class="post-date">Jan 27, 2026</span>
        <a class="post-link" href="My_Favorite_Texts.html">My Favorite Texts</a>
      </li>
        <li class="post-item">
        <span class="post-date">Jan 30, 2026</span>
        <a class="post-link" href="Current_Readings.html">Discovering Linear Logic, Projective Geometry, and Monoidal Categories</a>
      </li>
      </li>
        <li class="post-item">
        <span class="post-date">Feb 2, 2026</span>
        <a class="post-link" href="ZFC_axioms.html">ZFC Axioms</a>
      </li>
        <li class="post-item">
        <span class="post-date">Feb 2, 2026</span>
        <a class="post-link" href="To_Read_Measures.html">To Read: A Very Brief Measure Theory</a>
      </li>
    </ul>
    
  </main>

  <footer>
    &copy; <span id="year"></span> James Squires.
  </footer>
  
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
